backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.3;

corner-radius = 6;

inactive-opacity = 0.95;
active-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'Alacritty'"
];

blur-method = "none";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
