[module/i3]
type = internal/i3
format = <label-state>
index-sort = true
wrapping-scroll = false

label-focused = %name%
label-focused-foreground = ${colors.accent}

label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}

label-visible = %name%
label-urgent = %name%

[module/network]
type = internal/network
interface-type = auto
interval = 3
label-connected =   %local_ip%
label-disconnected =

[module/volume]
type = internal/pulseaudio
label-volume =    %percentage%% 
label-muted =   muted

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
label-charging =   %percentage%% 
label-discharging =    %percentage%% 
label-full =    full

[module/date]
type = internal/date
interval = 60
date = %a %d %b
time = %H:%M
label =    %date% %time%
